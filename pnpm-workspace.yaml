packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  # the Envio indexer installs on its own, with pnpm 10, as Envio Cloud's builder does (services/indexer/pnpm-workspace.yaml)
  - "!services/indexer"
  - "bots"
  - "cre/*"
  - "research/*"
  - "integrations/*"

# Dependencies allowed to run install scripts (vitest bundler; ESLint resolver binary).
allowBuilds:
  esbuild: true
  unrs-resolver: true
  # @oclif/plugin-plugins (under the MetaMask Agent Wallet plugin's dev dependency) carries yarn; its install script is not needed
  yarn: false

minimumReleaseAgeExclude:
  - lucide-react@1.51.0
