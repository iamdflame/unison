[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.33"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
gas_reports = ["*"]
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

# Differential testing against the TypeScript reference clearing (needs FFI).
[profile.diff]
ffi = true
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 128

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
