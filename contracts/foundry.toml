[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.33"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
gas_reports = ["*"]
# long simulations exceed the default 2^30 test gas; Monad itself caps a tx at 30M (tests use per-call caps)
gas_limit = "18446744073709551615"
# Monad allows 128 KB contracts (EIP-170's 24 KB does not apply); anvil: --code-size-limit 131072
code_size_limit = 131072
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read", path = "../deploy" },
    { access = "read-write", path = "../deployments" },
]
# differential tests need FFI + node: run them with FOUNDRY_PROFILE=diff
no_match_path = "test/diff/*"

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

# Differential testing against the TypeScript reference clearing (needs FFI).
[profile.diff]
ffi = true
fs_permissions = [{ access = "read-write", path = "./" }]
match_path = "test/diff/*"
no_match_path = "test/unit/*"

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 128

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
