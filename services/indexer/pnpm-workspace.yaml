# The indexer is its own pnpm project, outside the monorepo's workspace: Envio Cloud builds it with pnpm 10.32,
# which can't read the monorepo's pnpm 12 lockfile. package.json pins pnpm@10.32.0, so pnpm switches to it here.
packages: []
onlyBuiltDependencies:
  - esbuild
# envio 3.14.0 pins express 4.19.2; lift it and two transitive dependencies to their patched releases (Dependabot:
# path-to-regexp ReDoS, body-parser and qs DoS, ws memory exhaustion, send/serve-static template injection)
overrides:
  express: ^4.22.3
  qs: ^6.16.0
  ws: ^8.22.0
