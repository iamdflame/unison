name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# the jobs only read the repository: a pull request's code never gets a token that can write
permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (build, unit, fuzz, invariants, simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build
        working-directory: contracts
        run: forge build
      - name: Test
        working-directory: contracts
        run: forge test -vv

  fork:
    name: Mainnet rehearsals (fork tests on live Monad state; reports, does not block)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Fork tests
        working-directory: contracts
        # the upgrade, the timelock handover, the causal rule and the Data Streams verifier, each against the chain as
        # it is now; the block they ran at goes in the summary
        run: |
          block=$(cast block-number --rpc-url https://rpc.monad.xyz)
          echo "## Fork tests at Monad mainnet block $block" >> "$GITHUB_STEP_SUMMARY"
          set +e
          forge test --fork-url https://rpc.monad.xyz --fork-block-number "$block" --match-path "test/fork/*" -vv > fork.txt 2>&1
          code=$?
          set -e
          cat fork.txt
          { echo "<pre>"; grep -E "^\[(PASS|FAIL|SKIP)|Suite result|tests passed" fork.txt; echo "</pre>"; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  typescript:
    name: TypeScript (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test

  agent-wallet-plugin:
    name: MetaMask Agent Wallet plugin (bundle, manifest, write paths on a mainnet fork)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle, and write the oclif manifest through the host's own plugin SDK
        working-directory: integrations/agent-wallet-plugin
        run: pnpm build
      - name: Tests, with the write paths against Monad mainnet's contracts on an anvil fork
        working-directory: integrations/agent-wallet-plugin
        env:
          FORK: "1"
          ANVIL: anvil
        run: pnpm test

  indexer:
    name: Envio indexer (codegen, types, the handlers replaying mainnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # no pnpm cache: it would be the monorepo's (pnpm 12's store, keyed on the root lockfile), while this project
      # installs alone with pnpm 10 into another store, so saving it fails whenever the root lockfile changes.
      # The install takes two seconds.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (its own pnpm 10 project, as Envio Cloud's builder installs it)
        working-directory: services/indexer
        run: pnpm install --frozen-lockfile
      - name: Codegen
        working-directory: services/indexer
        run: pnpm codegen
      - name: Types (the handlers, checked as envio start checks them)
        working-directory: services/indexer
        run: pnpm types
      - name: Tests (the arithmetic against the contract, and the handlers replaying mainnet)
        working-directory: services/indexer
        run: pnpm test

  web:
    name: Website and app (lint, build, budgets, accessibility, controls)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @unison/web lint
      - name: Build, with source maps for attribution
        run: SOURCE_MAPS=1 pnpm --filter @unison/web build
      - name: JavaScript budgets (first load, gzip)
        working-directory: apps/web
        run: node scripts/weigh.mjs --check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Accessibility (WCAG 2.2 AA, every route, both lights), the shell's controls, the guided tour
        working-directory: apps/web
        run: |
          pnpm start > ../../next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          pnpm a11y
          node scripts/flow-shell.mjs
          node scripts/flow-tour.mjs
      - name: Server log
        if: failure()
        run: tail -n 100 next.log || true

  e2e:
    name: Live flows on a devnet (passkey to certificate, withdrawal, agent keys)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Devnet (anvil, deploy, relay, keeper, relayer, tape)
        run: |
          WEB_ENV_OUT=apps/web/.env.local node scripts/dev-stack.mjs > stack.log 2>&1 &
          for i in $(seq 1 300); do
            curl -sf http://127.0.0.1:8790/health | grep -q '"ok":true' && curl -sf http://127.0.0.1:8788/health > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8790/health
      - name: Build the app against the devnet
        run: pnpm --filter @unison/web build
      - name: Flows
        working-directory: apps/web
        run: |
          pnpm start > ../../next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          node scripts/flow-live.mjs
          node scripts/flow-portfolio.mjs
          node scripts/flow-agents.mjs
          LIVE=1 node scripts/flow-tour.mjs
      - name: Logs
        if: failure()
        run: tail -n 60 stack.log next.log .dev-stack/*.log || true

  differential:
    name: Solidity vs TypeScript differential fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:diff

  fairness:
    name: Sniper benchmark (evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: BLOCKS=200000 pnpm --filter @unison/sniper-bench bench >> "$GITHUB_STEP_SUMMARY"

  static-analysis:
    name: Static analysis (Slither; reports, does not block until its findings are triaged)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Slither
        working-directory: contracts
        run: |
          pip install "slither-analyzer>=0.11,<0.12"
          forge build --build-info --skip test script
          slither . --ignore-compile --config-file slither.config.json --checklist > slither.md || true
          { echo "## Slither"; cat slither.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: contracts/slither.md
          if-no-files-found: ignore

  aderyn:
    name: Static analysis (Aderyn; reports, does not block until its findings are triaged)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Aderyn
        working-directory: contracts
        # it reads foundry.toml, so only src/ is analysed (not tests, scripts or libraries)
        run: |
          npm install -g @cyfrin/aderyn
          aderyn --version
          aderyn . -o aderyn.md
          { echo "## Aderyn"; head -c 900000 aderyn.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-report
          path: contracts/aderyn.md
          if-no-files-found: ignore

  halmos:
    name: Symbolic proof, ${{ matrix.property }} (Halmos; reports, does not block yet)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # the two-tick properties take minutes; every property, with an hour each, runs in .github/workflows/proofs.yml
        property:
          - check_band2_pricesInsideTheBand_andNeverOverfills
          - check_band2_maximizesVolume
          - check_band2_marginalFillsAreExact
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Halmos
        working-directory: contracts
        env:
          HALMOS_ALLOW_DOWNLOAD: "1" # it fetches Bitwuzla, its assertion solver here, on first use
          PROPERTY: ${{ matrix.property }}
        run: bash test/halmos/prove.sh "$PROPERTY" 900 bitwuzla
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halmos-${{ matrix.property }}
          path: contracts/halmos-*.txt
          if-no-files-found: ignore
